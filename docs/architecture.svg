<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 948 300" width="948" height="300" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">SaaS template architecture</title>
  <desc id="architecture-desc">Requests flow from the browser through the Next.js App Router and its auth proxy to tRPC routers that enforce RBAC, then through Prisma to PostgreSQL; Better Auth manages sessions in the same database, and tRPC calls Resend for email and Supabase for file storage.</desc>
  <defs>
    <style>
      .bg, .mask { fill: #f5f5f5; }
      .t-ink { fill: #2d3142; }
      .t-muted { fill: #4f5d75; }
      .t-soft { fill: #7a8399; }
      .name { font: 600 12px Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sub { font-size: 9px; }
      .tag { font-size: 7px; letter-spacing: 0.08em; }
      .lbl { font-size: 8px; letter-spacing: 0.06em; }
      .svc { fill: #ffffff; stroke: #2d3142; }
      .focal { fill: rgba(235,108,54,0.08); stroke: #eb6c36; }
      .store { fill: rgba(45,49,66,0.05); stroke: #4f5d75; }
      .ext { fill: rgba(45,49,66,0.03); stroke: rgba(45,49,66,0.30); }
      .user { fill: rgba(79,93,117,0.10); stroke: #7a8399; }
      .tagbox { fill: none; stroke: rgba(45,49,66,0.35); }
      .tagbox-accent { fill: none; stroke: rgba(235,108,54,0.6); }
      .t-accent { fill: #eb6c36; }
      .ln { fill: none; stroke: #4f5d75; }
      .ln-link { fill: none; stroke: #2e5aa8; }
      .head { fill: #4f5d75; }
      .head-link { fill: #2e5aa8; }
      .rule { stroke: rgba(45,49,66,0.10); }
      @media (prefers-color-scheme: dark) {
        .bg, .mask { fill: #2d3142; }
        .t-ink { fill: #f5f5f5; }
        .t-muted { fill: #bfc0c0; }
        .t-soft { fill: #8e98ac; }
        .svc { fill: #393e53; stroke: #f5f5f5; }
        .focal { fill: rgba(240,138,89,0.12); stroke: #f08a59; }
        .store { fill: rgba(245,245,245,0.05); stroke: #bfc0c0; }
        .ext { fill: rgba(245,245,245,0.03); stroke: rgba(245,245,245,0.30); }
        .user { fill: rgba(191,192,192,0.10); stroke: #8e98ac; }
        .tagbox { stroke: rgba(245,245,245,0.35); }
        .tagbox-accent { stroke: rgba(240,138,89,0.6); }
        .t-accent { fill: #f08a59; }
        .ln { stroke: #bfc0c0; }
        .ln-link { stroke: #6a95d8; }
        .head { fill: #bfc0c0; }
        .head-link { fill: #6a95d8; }
        .rule { stroke: rgba(245,245,245,0.12); }
      }
    </style>
    <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon class="head" points="0 0, 8 3, 0 6"/>
    </marker>
    <marker id="architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon class="head-link" points="0 0, 8 3, 0 6"/>
    </marker>
  </defs>

  <rect class="bg" width="948" height="300" rx="8"/>

  <!-- Connectors (drawn before nodes) -->
  <line class="ln" x1="144" y1="128" x2="184" y2="128" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
  <line class="ln" x1="364" y1="128" x2="404" y2="128" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
  <line class="ln" x1="564" y1="128" x2="604" y2="128" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
  <line class="ln" x1="724" y1="128" x2="764" y2="128" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
  <line class="ln" x1="276" y1="100" x2="276" y2="68" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
  <path class="ln" d="M364,40 H656 Q664,40 664,48 V100" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-arrow)"/>
  <path class="ln-link" d="M452,156 V168 Q452,176 444,176 H388 Q380,176 380,184 V192" stroke-width="1.2" marker-end="url(#architecture-arrow-link)"/>
  <path class="ln-link" d="M516,156 V168 Q516,176 524,176 H596 Q604,176 604,184 V192" stroke-width="1.2" marker-end="url(#architecture-arrow-link)"/>

  <!-- Arrow labels (opaque masks, 8px above their line) -->
  <rect class="mask" x="148" y="108" width="32" height="12" rx="2"/>
  <text class="mono lbl t-soft" x="164" y="117" text-anchor="middle">HTTPS</text>
  <rect class="mask" x="368" y="108" width="32" height="12" rx="2"/>
  <text class="mono lbl t-soft" x="384" y="117" text-anchor="middle">RPC</text>
  <rect class="mask" x="568" y="108" width="32" height="12" rx="2"/>
  <text class="mono lbl t-soft" x="584" y="117" text-anchor="middle">QUERY</text>
  <rect class="mask" x="728" y="108" width="32" height="12" rx="2"/>
  <text class="mono lbl t-soft" x="744" y="117" text-anchor="middle">SQL</text>
  <rect class="mask" x="284" y="78" width="44" height="12" rx="2"/>
  <text class="mono lbl t-soft" x="306" y="87" text-anchor="middle">SESSION</text>
  <rect class="mask" x="440" y="20" width="88" height="12" rx="2"/>
  <text class="mono lbl t-soft" x="484" y="29" text-anchor="middle">PRISMA ADAPTER</text>

  <!-- Browser -->
  <rect class="mask" x="24" y="100" width="120" height="56" rx="6"/>
  <rect class="user" x="24" y="100" width="120" height="56" rx="6" stroke-width="1"/>
  <rect class="tagbox" x="32" y="106" width="40" height="12" rx="2" stroke-width="0.8"/>
  <text class="mono tag t-muted" x="52" y="115" text-anchor="middle">CLIENT</text>
  <text class="name t-ink" x="84" y="136" text-anchor="middle">Browser</text>
  <text class="mono sub t-muted" x="84" y="150" text-anchor="middle">React 19</text>

  <!-- Next.js -->
  <rect class="mask" x="184" y="100" width="180" height="56" rx="6"/>
  <rect class="svc" x="184" y="100" width="180" height="56" rx="6" stroke-width="1"/>
  <rect class="tagbox" x="192" y="106" width="28" height="12" rx="2" stroke-width="0.8"/>
  <text class="mono tag t-muted" x="206" y="115" text-anchor="middle">APP</text>
  <text class="name t-ink" x="274" y="136" text-anchor="middle">Next.js 16</text>
  <text class="mono sub t-muted" x="274" y="150" text-anchor="middle">proxy.ts · App Router</text>

  <!-- tRPC + RBAC (focal) -->
  <rect class="mask" x="404" y="100" width="160" height="56" rx="6"/>
  <rect class="focal" x="404" y="100" width="160" height="56" rx="6" stroke-width="1.2"/>
  <rect class="tagbox-accent" x="412" y="106" width="28" height="12" rx="2" stroke-width="0.8"/>
  <text class="mono tag t-accent" x="426" y="115" text-anchor="middle">API</text>
  <text class="name t-ink" x="484" y="136" text-anchor="middle">tRPC + RBAC</text>
  <text class="mono sub t-muted" x="484" y="150" text-anchor="middle">12 routers · permits()</text>

  <!-- Prisma -->
  <rect class="mask" x="604" y="100" width="120" height="56" rx="6"/>
  <rect class="svc" x="604" y="100" width="120" height="56" rx="6" stroke-width="1"/>
  <rect class="tagbox" x="612" y="106" width="28" height="12" rx="2" stroke-width="0.8"/>
  <text class="mono tag t-muted" x="626" y="115" text-anchor="middle">ORM</text>
  <text class="name t-ink" x="664" y="136" text-anchor="middle">Prisma 7</text>
  <text class="mono sub t-muted" x="664" y="150" text-anchor="middle">adapter-pg</text>

  <!-- PostgreSQL -->
  <rect class="mask" x="764" y="100" width="160" height="56" rx="6"/>
  <rect class="store" x="764" y="100" width="160" height="56" rx="6" stroke-width="1"/>
  <rect class="tagbox" x="772" y="106" width="24" height="12" rx="2" stroke-width="0.8"/>
  <text class="mono tag t-muted" x="784" y="115" text-anchor="middle">DB</text>
  <text class="name t-ink" x="844" y="136" text-anchor="middle">PostgreSQL</text>
  <text class="mono sub t-muted" x="844" y="150" text-anchor="middle">workspaces · roles</text>

  <!-- Better Auth -->
  <rect class="mask" x="184" y="12" width="180" height="56" rx="6"/>
  <rect class="svc" x="184" y="12" width="180" height="56" rx="6" stroke-width="1"/>
  <rect class="tagbox" x="192" y="18" width="32" height="12" rx="2" stroke-width="0.8"/>
  <text class="mono tag t-muted" x="208" y="27" text-anchor="middle">AUTH</text>
  <text class="name t-ink" x="274" y="48" text-anchor="middle">Better Auth 1.7</text>
  <text class="mono sub t-muted" x="274" y="62" text-anchor="middle">OAuth · passkey · OTP</text>

  <!-- Resend -->
  <rect class="mask" x="316" y="192" width="128" height="56" rx="6"/>
  <rect class="ext" x="316" y="192" width="128" height="56" rx="6" stroke-width="1"/>
  <rect class="tagbox" x="324" y="198" width="28" height="12" rx="2" stroke-width="0.8"/>
  <text class="mono tag t-muted" x="338" y="207" text-anchor="middle">EXT</text>
  <text class="name t-ink" x="380" y="228" text-anchor="middle">Resend</text>
  <text class="mono sub t-muted" x="380" y="242" text-anchor="middle">React Email</text>

  <!-- Supabase Storage -->
  <rect class="mask" x="524" y="192" width="160" height="56" rx="6"/>
  <rect class="ext" x="524" y="192" width="160" height="56" rx="6" stroke-width="1"/>
  <rect class="tagbox" x="532" y="198" width="28" height="12" rx="2" stroke-width="0.8"/>
  <text class="mono tag t-muted" x="546" y="207" text-anchor="middle">EXT</text>
  <text class="name t-ink" x="604" y="228" text-anchor="middle">Supabase Storage</text>
  <text class="mono sub t-muted" x="604" y="242" text-anchor="middle">signed uploads</text>

  <!-- Legend strip -->
  <line class="rule" x1="24" y1="264" x2="924" y2="264" stroke-width="0.8"/>
  <text class="mono lbl t-muted" x="24" y="284" letter-spacing="0.14em">LEGEND</text>
  <rect class="focal" x="96" y="276" width="20" height="12" rx="2" stroke-width="1"/>
  <text class="mono lbl t-muted" x="124" y="285">FOCAL</text>
  <rect class="svc" x="184" y="276" width="20" height="12" rx="2" stroke-width="1"/>
  <text class="mono lbl t-muted" x="212" y="285">SERVICE</text>
  <rect class="store" x="284" y="276" width="20" height="12" rx="2" stroke-width="1"/>
  <text class="mono lbl t-muted" x="312" y="285">STORE</text>
  <rect class="ext" x="372" y="276" width="20" height="12" rx="2" stroke-width="1"/>
  <text class="mono lbl t-muted" x="400" y="285">EXTERNAL</text>
  <line class="ln" x1="476" y1="282" x2="500" y2="282" stroke-width="1" stroke-dasharray="4,3"/>
  <text class="mono lbl t-muted" x="508" y="285">DATA ACCESS</text>
  <line class="ln-link" x1="600" y1="282" x2="624" y2="282" stroke-width="1.2"/>
  <text class="mono lbl t-muted" x="632" y="285">EXTERNAL API</text>
</svg>
