name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saas
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/saas
      # Dummy secret for CI only; must be 32+ characters
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789
      # Must match the Playwright base URL or sign-in fails the origin check
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # db:* scripts wrap .env.local, which CI does not have
      - name: Prepare database
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy
          pnpm exec tsx prisma/seed.ts

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
